<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bearsted Live Flight Radar</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0c0f12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #0c0f12; }
        .dashboard-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(16, 22, 30, 0.85); color: #00ffaa; padding: 15px 20px;
            border-radius: 12px; border: 1px solid rgba(0, 255, 170, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(5px);
        }
        .dashboard-overlay h3 { margin: 0 0 5px 0; font-size: 14px; letter-spacing: 2px; color: #8ab4f8; }
        #flight-count { font-size: 22px; font-weight: bold; font-family: monospace; }
        .leaflet-vml-shape, .leaflet-layer, .leaflet-marker-icon { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); } /* Elegant dark map trick */
    </style>
</head>
<body>

    <div class="dashboard-overlay">
        <h3>⚡ BEARSTED RADAR</h3>
        <div id="flight-count">Scanning...</div>
    </div>
    
    <div id="map"></div>
    
    <script>
        // Center of the map over Bearsted / Kent area
        const homeLat = 51.274;
        const homeLon = 0.565;

        // Initialize map
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([homeLat, homeLon], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Home Base Pin
        L.circleMarker([homeLat, homeLon], {color: '#0088ff', radius: 8}).addTo(map);

        let flightMarkers = {};

        async function fetchFlights() {
            // Pulling data from adsb.fi's open boundary radius tool
            const url = `https://adsb.fi{homeLat}/${homeLon}/40`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const count = data.ac ? data.ac.length : 0;
                document.getElementById('flight-count').innerText = `${count} PLANES OVERHEAD`;
                
                let currentFlights = {};

                if (data.ac) {
                    data.ac.forEach(flight => {
                        const callsign = (flight.flight || flight.registration || "UNK").trim();
                        const lat = flight.lat;
                        const lon = flight.lon;
                        const alt = flight.alt_baro ? `${flight.alt_baro} ft` : "---";
                        const spd = flight.gs ? `${Math.round(flight.gs)} kts` : "---";

                        if (lat && lon) {
                            currentFlights[callsign] = true;
                            const popupText = `<b>${callsign}</b><br>Alt: ${alt}<br>Spd: ${spd}`;

                            if (flightMarkers[callsign]) {
                                flightMarkers[callsign].setLatLng([lat, lon]);
                            } else {
                                flightMarkers[callsign] = L.circleMarker([lat, lon], {
                                    color: '#00ffaa', fillColor: '#00ffaa', fillOpacity: 0.8, radius: 5
                                }).addTo(map).bindPopup(popupText);
                            }
                        }
                    });
                }

                // Remove planes that flew away
                for (let callsign in flightMarkers) {
                    if (!currentFlights[callsign]) {
                        map.removeLayer(flightMarkers[callsign]);
                        delete flightMarkers[callsign];
                    }
                }

            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('flight-count').innerText = "FETCH FAILED";
            }
        }

        fetchFlights();
        setInterval(fetchFlights, 10000);
    </script>


    
</body>
</html>
