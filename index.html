<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bearsted Live Flight Radar</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0c0f12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #0c0f12; }
        .dashboard-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(16, 22, 30, 0.85); color: #00ffaa; padding: 15px 20px;
            border-radius: 12px; border: 1px solid rgba(0, 255, 170, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(5px);
        }
        .dashboard-overlay h3 { margin: 0 0 5px 0; font-size: 14px; letter-spacing: 2px; color: #8ab4f8; }
        #flight-count { font-size: 22px; font-weight: bold; font-family: monospace; }
        .leaflet-vml-shape, .leaflet-layer, .leaflet-marker-icon { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); } /* Elegant dark map trick */
    </style>
</head>
<body>

    <div class="dashboard-overlay">
        <h3>⚡ BEARSTED RADAR</h3>
        <div id="flight-count">Scanning...</div>
    </div>
    
    <div id="map"></div>
    
       <script>
        // Center map over Bearsted / Kent area
        const homeLat = 51.274;
        const homeLon = 0.565;

        // Initialize map without clutter
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([homeLat, homeLon], 10);
        
        // Add map textures
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Home Base Marker
        L.circleMarker([homeLat, homeLon], {color: '#0088ff', fillColor: '#0088ff', fillOpacity: 0.4, radius: 8}).addTo(map);
        L.circle([homeLat, homeLon], {radius: 8046, color: '#0088ff', weight: 1, fill: false, dashArray: '5, 5'}).addTo(map); // 5-mile boundary

        let flightMarkers = {};

        async function fetchFlights() {
            // Coordinate boundaries roughly covering Kent/Maidstone
            const lamin = 51.0;
            const lamax = 51.5;
            const lomin = 0.2;
            const lomax = 0.9;

            const targetUrl = `https://opensky-network.org{lamin}&lamax=${lamax}&lomin=${lomin}&lomax=${lomax}`;
            
            // WEAPON OF CHOICE: Appending corsproxy.io strips away the browser block
            const proxiedUrl = `https://corsproxy.io{encodeURIComponent(targetUrl)}`;
            
            try {
                const response = await fetch(proxiedUrl);
                if (!response.ok) throw new Error("Network response failed");
                
                const data = await response.json();
                
                const count = data.states ? data.states.length : 0;
                document.getElementById('flight-count').innerText = `${count} PLANES OVERHEAD`;
                
                let currentFlights = {};

                if (data.states) {
                    data.states.forEach(flight => {
                        const callsign = (flight[1] || "UNK").trim();
                        const lon = flight[5];
                        const lat = flight[6];
                        const alt = flight[7] ? `${Math.round(flight[7] * 3.28084)} ft` : "---"; // Metres to feet
                        const spd = flight[9] ? `${Math.round(flight[9] * 1.94384)} kts` : "---"; // M/s to knots

                        if (lat && lon) {
                            currentFlights[callsign] = true;
                            const popupText = `<b>${callsign}</b><br>Alt: ${alt}<br>Spd: ${spd}`;

                            if (flightMarkers[callsign]) {
                                flightMarkers[callsign].setLatLng([lat, lon]);
                                flightMarkers[callsign].getPopup().setContent(popupText);
                            } else {
                                flightMarkers[callsign] = L.circleMarker([lat, lon], {
                                    color: '#00ffaa', fillColor: '#00ffaa', fillOpacity: 0.8, radius: 6
                                }).addTo(map).bindPopup(popupText);
                            }
                        }
                    });
                }

                // Remove planes that exited our coordinates
                for (let callsign in flightMarkers) {
                    if (!currentFlights[callsign]) {
                        map.removeLayer(flightMarkers[callsign]);
                        delete flightMarkers[callsign];
                    }
                }

            } catch (error) {
                console.error("CORS Proxy Error:", error);
                document.getElementById('flight-count').innerText = "DATA ERROR / RATE LIMIT";
            }
        }

        // Fetch flights immediately, then every 20 seconds to prevent OpenSky blocking your IP address
        fetchFlights();
        setInterval(fetchFlights, 20000);
    </script>


    
</body>
</html>
