<!DOCTYPE html>
<html>
<head>
  <title>Planes Over Maidstone</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  const home = { lat: 51.2726, lon: 0.5217 };

  const map = L.map('map').setView([home.lat, home.lon], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  let planeMarkers = {};

  async function fetchPlanes() {
    try {
      // Your Cloudflare Worker URL
     // const url = "https://solitary-grass-616a.long-salad-3a61.workers.dev/?lamin=49.5&lomin=-8.0&lamax=61.0&lomax=2.0";
      const url = "https://solitary-grass-616a.long-salad-3a61.workers.dev/?lamin=40&lomin=-10&lamax=60&lomax=10";


      const response = await fetch(url);
      const data = await response.json();

      // OpenSky format uses "states"
      if (!data.states || data.states.length === 0) {
        console.log("No aircraft found");
        return;
      }

      data.states.forEach(state => {
        const icao = state[0];     // ICAO hex
        const callsign = state[1]; // Callsign
        const lon = state[5];      // Longitude
        const lat = state[6];      // Latitude

        if (!lat || !lon) return;

        if (!planeMarkers[icao]) {
          planeMarkers[icao] = L.marker([lat, lon]).addTo(map);
        } else {
          planeMarkers[icao].setLatLng([lat, lon]);
        }

        planeMarkers[icao].bindPopup(`Callsign: ${callsign || "Unknown"}`);
      });

    } catch (err) {
      console.error("Error fetching planes:", err);
    }
  }

  fetchPlanes();
  setInterval(fetchPlanes, 10000);
</script>

</body>
</html>
