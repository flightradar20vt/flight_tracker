<script>
  // Maidstone town centre coordinates
  const home = { lat: 51.2726, lon: 0.5217 };

  const map = L.map('map').setView([home.lat, home.lon], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  let planeMarkers = {};

  async function fetchPlanes() {
    // Bounding box around Maidstone (roughly 20–25 km radius)
    const url = "https://opensky-network.org/api/states/all?lamin=51.10&lomin=0.30&lamax=51.40&lomax=0.75";

    const response = await fetch(url);
    const data = await response.json();

    if (!data.states) return;

    data.states.forEach(state => {
      const icao = state[0];
      const lat = state[6];
      const lon = state[5];
      const callsign = state[1];

      if (!lat || !lon) return;

      if (!planeMarkers[icao]) {
        planeMarkers[icao] = L.marker([lat, lon]).addTo(map);
      } else {
        planeMarkers[icao].setLatLng([lat, lon]);
      }

      planeMarkers[icao].bindPopup(`Callsign: ${callsign || "Unknown"}`);
    });
  }

  fetchPlanes();
  setInterval(fetchPlanes, 5000);
</script>
