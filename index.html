<!DOCTYPE html>
<html>
<head>
  <title>Planes Over Maidstone</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  // Maidstone town centre
  const home = { lat: 51.2726, lon: 0.5217 };

  // Create map
  const map = L.map('map').setView([home.lat, home.lon], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  let planeMarkers = {};

  async function fetchPlanes() {
    try {
      // Bounding box around Maidstone
      const url = "https://opensky-network.org/api/states/all?lamin=51.15&lomin=0.30&lamax=51.40&lomax=0.80";

      const response = await fetch(url);
      const data = await response.json();

      if (!data.states) {
        console.log("No states returned");
        return;
      }

      data.states.forEach(state => {
        const icao = state[0];
        const callsign = state[1];
        const lon = state[5];
        const lat = state[6];

        // Skip aircraft with missing coordinates
        if (!lat || !lon) return;

        if (!planeMarkers[icao]) {
          planeMarkers[icao] = L.marker([lat, lon]).addTo(map);
        } else {
          planeMarkers[icao].setLatLng([lat, lon]);
        }

        planeMarkers[icao].bindPopup(`Callsign: ${callsign || "Unknown"}`);
      });
    } catch (err) {
      console.error("Error fetching planes:", err);
    }
  }

  fetchPlanes();
  setInterval(fetchPlanes, 5000);
</script>
</body>
</html>
