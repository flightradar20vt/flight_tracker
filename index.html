<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Private Bearsted Airspace Radar</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0b0e14; font-family: monospace; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #0b0e14; }
        .radar-hud {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(11, 14, 20, 0.9); color: #00ff66; padding: 15px 20px;
            border-radius: 6px; border: 1px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); pointer-events: none;
        }
        .radar-hud h2 { margin: 0 0 5px 0; font-size: 14px; letter-spacing: 2px; color: #00ff66; }
        #target-count { font-size: 20px; font-weight: bold; }
        .leaflet-layer, .leaflet-control-attribution { 
            filter: invert(100%) hue-rotate(180deg) brightness(40%) contrast(130%) saturate(50%); 
        }
        .radar-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: #00ff66 !important;
            font-weight: bold;
            font-family: monospace;
            font-size: 11px;
            text-shadow: 1px 1px 2px #000;
        }
        .leaflet-tooltip-right::before { border-right-color: transparent !important; }
    </style>
</head>
<body>

    <div class="radar-hud">
        <h2>🛰️ MAIDSTONE TACTICAL</h2>
        <div id="target-count">TRACKING: 0 TARGETS</div>
    </div>
    
    <div id="map"></div>

    <script>
        const homeLat = 51.274;
        const homeLon = 0.565;

        // Initialize Map
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([homeLat, homeLon], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Home Base Marker & 10 Mile Radius Range Ring
        L.circleMarker([homeLat, homeLon], {color: '#00ff66', fillColor: '#00ff66', fillOpacity: 0.6, radius: 6}).addTo(map);
        L.circle([homeLat, homeLon], {radius: 16093, color: '#00ff66', weight: 1, fill: false, dashArray: '4, 6'}).addTo(map); 

        let aircraftMarkers = {};

        async function updateRadar() {
            // FIXED: Using the exact, keyless AvioADSB point radius path syntax with a safe 85 NM boundary
            var url = "https://avioadsb.org/v1/point/" + homeLat + "/" + homeLon + "/85";
            
            try {
                var response = await fetch(url);
                if (!response.ok) throw new Error("Sync Interrupted");
                
                var data = await response.json();
                
                var count = data && data.ac ? data.ac.length : 0;
                document.getElementById('target-count').innerText = "TRACKING: " + count + " TARGETS";
                
                var activeTargets = {};

                if (data && data.ac) {
                    data.ac.forEach(function(aircraft) {
                        var callsign = (aircraft.flight || aircraft.registration || "UNK").trim();
                        var lat = aircraft.lat;
                        var lon = aircraft.lon;
                        var alt = aircraft.alt_baro ? aircraft.alt_baro + " FT" : "GND";
                        var spd = aircraft.gs ? Math.round(aircraft.gs) + " KTS" : "---";

                        if (lat && lon) {
                            activeTargets[callsign] = true;
                            var hudPopup = "<b>ID: " + callsign + "</b><br>ALT: " + alt + "<br>SPD: " + spd;

                            if (aircraftMarkers[callsign]) {
                                aircraftMarkers[callsign].setLatLng([lat, lon]);
                                aircraftMarkers[callsign].getPopup().setContent(hudPopup);
                            } else {
                                // Draw bright tactical radar blip
                                aircraftMarkers[callsign] = L.circleMarker([lat, lon], {
                                    color: '#00ff66', fillColor: '#0b0e14', fillOpacity: 0.9, weight: 2, radius: 6
                                }).addTo(map).bindPopup(hudPopup);
                                
                                // Permanently attach visible text label beside the dot
                                aircraftMarkers[callsign].bindTooltip(callsign, {
                                    permanent: true, direction: 'right', className: 'radar-label', offset: [5, 0]
                                });
                            }
                        }
                    });
                }

                // Clean up targets that fly away
                for (var key in aircraftMarkers) {
                    if (!activeTargets[key]) {
                        map.removeLayer(aircraftMarkers[key]);
                        delete aircraftMarkers[key];
                    }
                }

            } catch (error) {
                console.error("Radar Sync Interrupted:", error);
                document.getElementById('target-count').innerText = "RADAR SYNC ERROR";
            }
        }

        // Run radar sweep every 12 seconds to fit inside anonymous rate limits safely
        updateRadar();
        setInterval(updateRadar, 12000);
    </script>
</body>
</html>
