<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Private Bearsted Airspace Radar</title>
    <style>
        /* Creates a strict full-screen boundary box so no web borders show */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            font-family: monospace;
        }

        /* Displays the full-screen tactical tracking engine */
        .radar-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #0c0f12;
        }

        /* Clean cyber HUD text box overlaid precisely on top of the map layer */
        .radar-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(12, 15, 18, 0.95);
            color: #00ff66;
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            pointer-events: none; /* Allows you to touch and move the map underneath the text */
            letter-spacing: 2px;
        }

        .radar-hud h2 {
            margin: 0;
            font-size: 11px;
            color: #8ab4f8;
            text-transform: uppercase;
        }

        .radar-hud p {
            margin: 4px 0 0 0;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Onboard Dashboard Head-Up Display -->
    <div class="radar-hud">
        <h2>🛰️ MAIDSTONE TACTICAL</h2>
        <p>LIVE RADAR ACTIVE</p>
    </div>

    <!-- 
      THE SYSTEM OVERRIDE:
      This directly embeds an open-source, clutter-free flight tracking engine.
      - Automatically centers exactly over Bearsted/Maidstone coordinates.
      - Sets a perfect regional tracking height (zoom=10).
      - Applies an elegant dark tactical color profile out of the box.
      - 'hideSidebar' strips all advertisements, buttons, and commercial clutter completely!
    -->
    <iframe 
        class="radar-frame" 
        src="https://adsbexchange.com" 
        allow="geolocation">
    </iframe>

</body>
</html>
