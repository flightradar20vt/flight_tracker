<!DOCTYPE html>
<html>
<head>
  <title>Planes Over My House</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  const home = { lat: 53.4808, lon: -2.2426 };

  const map = L.map('map').setView([home.lat, home.lon], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  let planeMarkers = {};

  async function fetchPlanes() {
    const url = "https://opensky-network.org/api/states/all?lamin=53.3&lomin=-2.5&lamax=53.7&lomax=-2.0";
    const response = await fetch(url);
    const data = await response.json();

    if (!data.states) return;

    data.states.forEach(state => {
      const icao = state[0];
      const lat = state[6];
      const lon = state[5];
      const callsign = state[1];

      if (!lat || !lon) return;

      if (!planeMarkers[icao]) {
        planeMarkers[icao] = L.marker([lat, lon]).addTo(map);
      } else {
        planeMarkers[icao].setLatLng([lat, lon]);
      }

      planeMarkers[icao].bindPopup(`Callsign: ${callsign || "Unknown"}`);
    });
  }

  fetchPlanes();
  setInterval(fetchPlanes, 5000);
</script>
</body>
</html>
