<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bearsted Live Radar Terminal</title>
    <style>
        /* Force a total fullscreen kiosk bounding box with no scroll bars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #141a22;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Borderless container for the tracking engine */
        .radar-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Minimalist HUD banner layered neatly on top of the map */
        .kiosk-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 9999;
            background: rgba(10, 15, 24, 0.9);
            color: #00ffaa;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 170, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none; /* Allows you to tap the map underneath the text box */
            letter-spacing: 1px;
        }

        .kiosk-hud h1 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            color: #8ab4f8;
        }

        .kiosk-hud p {
            margin: 3px 0 0 0;
            font-size: 16px;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Onboard Dashboard Head-Up Display -->
    <div class="kiosk-hud">
        <h1>🛰️ Standalone Terminal</h1>
        <p>KENT AIRSPACE</p>
    </div>

    <!-- 
      This embeds the high-efficiency tracking engine.
      - lat/lon are set directly to the middle of Bearsted/Maidstone
      - zoom is set to 10 (perfect for regional views)
      - hideSidebar drops the clutter for clean kiosk displays
    -->
    <iframe 
        class="radar-frame" 
        src="https://adsb.fi" 
        allow="geolocation">
    </iframe>

</body>
</html>
