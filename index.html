<script>
  const home = { lat: 51.2726, lon: 0.5217 };

  const map = L.map('map').setView([home.lat, home.lon], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  let planeMarkers = {};

  async function fetchPlanes() {
    try {
      // UK-wide bounding box (much more reliable)
      const url = "https://opensky-network.org/api/states/all?lamin=49.5&lomin=-8.0&lamax=61.0&lomax=2.0";

      const response = await fetch(url);
      const data = await response.json();

      if (!data.states) {
        console.log("No aircraft returned");
        return;
      }

      data.states.forEach(state => {
        const icao = state[0];
        const callsign = state[1];
        const lon = state[5];
        const lat = state[6];

        if (!lat || !lon) return;

        if (!planeMarkers[icao]) {
          planeMarkers[icao] = L.marker([lat, lon]).addTo(map);
        } else {
          planeMarkers[icao].setLatLng([lat, lon]);
        }

        planeMarkers[icao].bindPopup(`Callsign: ${callsign || "Unknown"}`);
      });
    } catch (err) {
      console.error("Error fetching planes:", err);
    }
  }

  fetchPlanes();
  setInterval(fetchPlanes, 5000);
</script>
